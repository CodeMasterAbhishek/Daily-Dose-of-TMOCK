<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 280px;
      padding: 16px;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 {
      margin-top: 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    p {
      font-size: 12px;
      opacity: 0.8;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: none;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
      margin-bottom: 8px;
    }
    .btn-scrape {
      background: #2563eb;
    }
    .btn-scrape:hover {
      background: #1d4ed8;
    }
    .btn-download {
      background: #059669;
    }
    .btn-download:hover {
      background: #047857;
    }
    .btn-clear {
      background: #475569;
    }
    .stats-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
      text-align: center;
    }
    .stats-count {
      font-size: 26px;
      font-weight: 900;
      color: #38bdf8;
    }
    .stats-label {
      font-size: 11px;
      opacity: 0.7;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <h3>🎬 Sony LIV Scraper</h3>
  <p>Scroll & load episodes as you like, then click below to record and download JSON!</p>

  <button id="scrape-btn" class="btn btn-scrape">📸 Record Visible Episodes</button>
  <button id="download-btn" class="btn btn-download">📥 Download JSON Dataset</button>
  <button id="clear-btn" class="btn btn-clear">🗑️ Reset Counter</button>

  <div class="stats-box">
    <div id="ep-count" class="stats-count">0</div>
    <div class="stats-label">Total Episodes Saved</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
