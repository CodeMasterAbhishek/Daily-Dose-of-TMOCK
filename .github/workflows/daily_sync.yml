name: Daily TMKOC Episode Sync

on:
  schedule:
    # Runs every 30 minutes to aggressively catch re-uploaded episodes and dead links
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  sync-episodes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto-Sync Script
        run: |
          python update_website.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes.csv state.json
          git status
          git diff-index --quiet HEAD || (git commit -m "Auto-update: Synced new TMKOC episodes [skip ci]" && git push)
