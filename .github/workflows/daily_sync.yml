name: Daily TMKOC Episode Sync

on:
  schedule:
    # Runs every 6 hours to catch re-uploaded episodes and dead links efficiently
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

concurrency:
  group: sync-episodes
  cancel-in-progress: false

jobs:
  sync-episodes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto-Sync Script
        run: |
          python scripts/update_website.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/episodes.csv data/state.json activity_logs.md
          git status
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update: Synced new TMKOC episodes [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
