name: Daily TMKOC Playlist Auto-Sync

on:
  schedule:
    # Runs daily at 18:00 UTC (11:30 PM IST after new TMKOC episodes release)
    - cron: '0 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  sync-episodes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto-Sync Script
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
        run: |
          python auto_update_playlist.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes.csv state.json
          git status
          git diff-index --quiet HEAD || (git commit -m "Auto-update: Synced new TMKOC episodes [skip ci]" && git push)
